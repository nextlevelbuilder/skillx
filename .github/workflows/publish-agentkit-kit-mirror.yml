# Mirrors every foundation skill of one AgentKit kit as `@agentkit/<x>` kit
# releases (skillx.release/v2, provenance {provider: kit, origin:
# remote-signed}), so AgentKit personal kits that extend the kit can pin
# their bases on SkillX.
#
# Run it by hand only (workflow_dispatch from main), once per kit version.
#
# The skill set and the expected digests come from AgentKit itself: the plan
# job builds `ak` from bestagentkits/agentkit at the pinned commit, creates a
# throwaway personal kit extending <kit>@<kit.yaml version> in an isolated
# home, and reads `ak skills kit inspect --json`. Each package is
# `@agentkit/<x>` for the directory kits/<ownerKit>/skills/ak-<x>, and its
# baseTreeDigest is the releaseDigest a revision pins. The publish job packs
# each directory with `skillx pack` and refuses to upload a pack whose digest
# differs, so a mirror can never serve a tree AgentKit would not verify.
#
# Visibility follows the owning kit's tier: a skill of a `tier: free` kit is
# published public; every other skill (a paid kit, or no declared tier) is
# published private, readable only by the agentkit publisher's owner and by
# entitled viewers, so paid kit content never becomes public on SkillX.
#
# A package already published at the version with the same digest is
# skipped; one published with another digest fails that entry. Every attempt
# sends the Idempotency-Key agentkit-kit-mirror:<sha>:<identity>@<version>, so
# a re-run never publishes twice. `dry-run: true` stops after the digest
# check.
#
# Authentication, in order:
#   1. GitHub OIDC trusted publishing (`skillx publish --oidc`): the registry
#      must hold a trusted publisher of @agentkit for repository
#      nextlevelbuilder/skillx, workflow
#      .github/workflows/publish-agentkit-kit-mirror.yml, ref refs/heads/main
#      and environment skillx-publish (see docs/deployment-guide.md).
#   2. Fallback: SKILLX_AGENTKIT_KIT_PUBLISH_KEY, an API key scoped to
#      releases:publish:@agentkit, stored as a skillx-publish environment
#      secret. Used only when the OIDC exchange is refused (exit code 5) or the
#      registry answers oidc.unavailable.
#
# The plan job builds both CLIs without id-token or the environment; the
# publish job installs the skillx CLI from its packed tarball with lifecycle
# scripts disabled and never runs `ak`.
#
# AGENTKIT_READ_TOKEN (read-only contents access to bestagentkits/agentkit)
# is needed while that repository is private.
name: Mirror AgentKit kit foundations

on:
  workflow_dispatch:
    inputs:
      agentkit-sha:
        description: "Full 40-character commit SHA of bestagentkits/agentkit to mirror"
        required: true
        type: string
      kit:
        description: "Installable kit directory, e.g. engineer"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: false
        default: beta
        type: choice
        options: [stable, beta, alpha]
      only:
        description: "Optional space-separated @agentkit/<x> identities; empty mirrors the whole kit"
        required: false
        type: string
      dry-run:
        description: "Plan and check digests only; upload nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: skillx-agentkit-kit-mirror-${{ inputs.kit }}
  cancel-in-progress: false

jobs:
  # Builds the skillx CLI and `ak`, and plans the mirror, without id-token or
  # the skillx-publish environment.
  plan:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        env:
          SHA: ${{ inputs.agentkit-sha }}
          KIT: ${{ inputs.kit }}
          CHANNEL: ${{ inputs.channel }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::agentkit-sha must be a full lowercase commit SHA"; exit 1; }
          [[ "$KIT" =~ ^[a-z0-9][a-z0-9-]{0,63}$ && "$KIT" != core ]] || { echo "::error::kit must be an installable kit directory (core is not installable)"; exit 1; }
          [[ "$CHANNEL" =~ ^(stable|beta|alpha)$ ]] || { echo "::error::invalid channel"; exit 1; }
          for id in $ONLY; do
            [[ "$id" =~ ^@agentkit/[a-z0-9][a-z0-9._-]*$ ]] || { echo "::error::only: $id is not @agentkit/<slug>"; exit 1; }
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: skillx

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bestagentkits/agentkit
          ref: ${{ inputs.agentkit-sha }}
          path: agentkit
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.AGENTKIT_READ_TOKEN || github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: skillx/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: skillx/pnpm-lock.yaml

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: agentkit/apps/cli/go.mod
          cache: false

      - name: Build and pack the skillx CLI
        working-directory: skillx
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter skillx-sh build
          mkdir -p "$RUNNER_TEMP/out"
          pnpm --filter skillx-sh pack --pack-destination "$RUNNER_TEMP/out"
          mv "$RUNNER_TEMP"/out/skillx-sh-*.tgz "$RUNNER_TEMP/out/skillx-sh.tgz"

      - name: Plan the mirror with ak
        env:
          SHA: ${{ inputs.agentkit-sha }}
          KIT: ${{ inputs.kit }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/agentkit"
          [[ "$(git -C "$root" rev-parse HEAD)" == "$SHA" ]] || { echo "::error::checked out the wrong agentkit commit"; exit 1; }
          [[ -f "$root/kits/$KIT/kit.yaml" ]] || { echo "::error::kits/$KIT/kit.yaml does not exist at $SHA"; exit 1; }
          (cd "$root/apps/cli" && go build -trimpath -o "$RUNNER_TEMP/ak" .)
          home="$(mktemp -d)"
          export HOME="$home" AGENTKIT_HOME="$home/.agentkit" AGENTKIT_CLAUDE_HOME="$home/.claude" CODEX_HOME="$home/.codex" \
            XDG_CONFIG_HOME="$home/.config" XDG_CACHE_HOME="$home/.cache" AGENTKIT_KITS_DIR="$root/kits" \
            AGENTKIT_SKILL_OVERLAYS=1 AGENTKIT_SKILL_STORE=1
          version="$(sed -n 's/^version:[[:space:]]*["'\'']\{0,1\}\([^"'\'' ]*\).*$/\1/p' "$root/kits/$KIT/kit.yaml" | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::kits/$KIT/kit.yaml has no SemVer version"; exit 1; }
          "$RUNNER_TEMP/ak" skills kit init mirror --extends "$KIT@$version" >&2
          "$RUNNER_TEMP/ak" skills kit inspect mirror --json > "$RUNNER_TEMP/inspect.json"
          node "$GITHUB_WORKSPACE/skillx/scripts/agentkit-kit-mirror-plan.mjs" "$RUNNER_TEMP/inspect.json" "$root" "$KIT" "$version" "$ONLY" > "$RUNNER_TEMP/out/plan.json"
          node -e 'const p=require(process.argv[1]); console.log(`Planned ${p.entries.length} @agentkit releases of ${p.kit}@${p.version}`); for (const e of p.entries) console.log(`${e.identity} ${e.visibility} ${e.path} ${e.releaseDigest}`)' "$RUNNER_TEMP/out/plan.json"
          rm -rf "$home"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kit-mirror-plan
          path: |
            ${{ runner.temp }}/out/skillx-sh.tgz
            ${{ runner.temp }}/out/plan.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: skillx-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bestagentkits/agentkit
          ref: ${{ inputs.agentkit-sha }}
          path: agentkit
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.AGENTKIT_READ_TOKEN || github.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kit-mirror-plan
          path: ${{ runner.temp }}/in

      - name: Install the skillx CLI (lifecycle scripts disabled)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/cli" --no-save --ignore-scripts --omit=dev --no-audit --no-fund "$RUNNER_TEMP/in/skillx-sh.tgz"
          node "$RUNNER_TEMP/cli/node_modules/skillx-sh/bin/skillx.js" --version

      - name: Check, pack and publish
        working-directory: agentkit
        env:
          SKILLX_AGENTKIT_KIT_PUBLISH_KEY: ${{ secrets.SKILLX_AGENTKIT_KIT_PUBLISH_KEY }}
          SHA: ${{ inputs.agentkit-sha }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SHA" ]] || { echo "::error::checked out the wrong agentkit commit"; exit 1; }
          cli="$RUNNER_TEMP/cli/node_modules/skillx-sh/bin/skillx.js"
          plan="$RUNNER_TEMP/in/plan.json"
          version="$(node -e 'process.stdout.write(require(process.argv[1]).version)' "$plan")"
          field() { node -e 'const e=require(process.argv[1]).entries[Number(process.argv[2])]; process.stdout.write(String(e[process.argv[3]]))' "$plan" "$1" "$2"; }
          count="$(node -e 'process.stdout.write(String(require(process.argv[1]).entries.length))' "$plan")"
          clean() { tr -d '\r' | tr '\n' ' ' | sed 's/::*/:/g'; }
          published=0 skipped=0 checked=0 failed=0
          echo "### @agentkit mirror of $(node -e 'process.stdout.write(require(process.argv[1]).kit)' "$plan")@$version ($SHA)" >> "$GITHUB_STEP_SUMMARY"
          for ((i = 0; i < count; i++)); do
            id="$(field "$i" identity)"; path="$(field "$i" path)"; want="$(field "$i" releaseDigest)"; vis="$(field "$i" visibility)"
            # Already mirrored? A listing is public for a public package; a
            # private one answers 404 here and the publish replay decides.
            code="$(curl -sS -o "$RUNNER_TEMP/releases.json" -w '%{http_code}' "https://skillx.sh/api/v1/packages/$id/releases" || echo 000)"
            if [[ "$code" == 200 ]]; then
              have="$(node -e 'const r=require(process.argv[1]).releases.find((x)=>x.version===process.argv[2]); process.stdout.write(r ? r.releaseDigest : "")' "$RUNNER_TEMP/releases.json" "$version")"
              if [[ "$have" == "$want" ]]; then
                echo "skip $id@$version: already mirrored"; skipped=$((skipped + 1)); continue
              elif [[ -n "$have" ]]; then
                echo "::error::$id@$version is published as $have, not $want"; echo "- $id: published with another digest" >> "$GITHUB_STEP_SUMMARY"; failed=$((failed + 1)); continue
              fi
            fi
            pack_json="$RUNNER_TEMP/pack.json"
            if ! node "$cli" pack HEAD --path "$path" --out "$RUNNER_TEMP/release.tar" --json > "$pack_json"; then
              echo "::error::$id: skillx pack failed"; failed=$((failed + 1)); continue
            fi
            got="$(node -e 'process.stdout.write(String(require(process.argv[1]).data.releaseDigest))' "$pack_json")"
            if [[ "$got" != "$want" ]]; then
              echo "::error::$id: skillx packs $path as $got, AgentKit pins $want; nothing was uploaded"
              echo "- $id: pack digest differs" >> "$GITHUB_STEP_SUMMARY"; failed=$((failed + 1)); continue
            fi
            checked=$((checked + 1))
            [[ "$DRY_RUN" == true ]] && { echo "ok $id@$version $got ($vis)"; continue; }
            out="$RUNNER_TEMP/release.json"
            publish() {
              node "$cli" publish HEAD --path "$path" --name "$id" --release-version "$version" --channel "$CHANNEL" \
                --kit-origin remote-signed --visibility "$vis" --repo https://github.com/bestagentkits/agentkit \
                --registry https://skillx.sh --idempotency-key "agentkit-kit-mirror:$SHA:$id@$version" --json "$@"
            }
            registry_code() { node -e 'try { process.stdout.write(String(require(process.argv[1]).error?.details?.code ?? "")) } catch {}' "$out"; }
            status=0
            SKILLX_API_KEY= publish --oidc > "$out" || status=$?
            if [[ $status -ne 0 && -n "$SKILLX_AGENTKIT_KIT_PUBLISH_KEY" ]] && [[ $status -eq 5 || "$(registry_code)" == "oidc.unavailable" ]]; then
              status=0
              SKILLX_API_KEY="$SKILLX_AGENTKIT_KIT_PUBLISH_KEY" publish > "$out" || status=$?
            fi
            if [[ $status -ne 0 ]]; then
              msg="$(node -e 'const j=require(process.argv[1]); console.log(`${j.error?.details?.code ?? j.error?.code}: ${j.error?.message}`)' "$out" 2>/dev/null | clean || true)"
              echo "::error::$id: $msg"; echo "- $id: $msg" >> "$GITHUB_STEP_SUMMARY"; failed=$((failed + 1)); continue
            fi
            served="$(node -e 'process.stdout.write(String(require(process.argv[1]).data.releaseDigest))' "$out")"
            if [[ "$served" != "$want" ]]; then
              echo "::error::$id: registry releaseDigest $served differs from $want"; failed=$((failed + 1)); continue
            fi
            echo "published $id@$version $served ($vis)"; published=$((published + 1))
          done
          echo "- checked $checked, published $published, already mirrored $skipped, failed $failed (dry run: $DRY_RUN)" >> "$GITHUB_STEP_SUMMARY"
          [[ $failed -eq 0 ]] || exit 1
